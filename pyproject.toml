# snakechat/pyproject.toml
[project]
name = "snakechat"
version = "1.0.1"
description = "Un cliente WhatsApp Web multi-dispositivo para Python"
requires-python = ">=3.10"
dependencies = [
    "websockets>=12.0",
    "cryptography>=42.0.0",
    "protobuf>=4.25.0",
    "qrcode>=7.4.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["binary*", "crypto*", "protobuf*", "state*", "wapipeline*"]

[tool.setuptools]
py-modules = ["client"]
